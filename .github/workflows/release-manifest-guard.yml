name: Release Manifest Guard

on:
  workflow_dispatch:
  release:
    types: [published, prereleased]

jobs:
  validate-download-security-manifest:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts and compute SHA-256
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path temp -Force | Out-Null

          $stableUrl = 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'
          $ptbUrl = 'https://discord.com/api/download/ptb?platform=win'

          function Extract-Version([string]$Text) {
            if ([string]::IsNullOrWhiteSpace($Text)) {
              return ''
            }

            $match = [regex]::Match($Text, '(\d+\.\d+\.\d+)')
            if ($match.Success) {
              return $match.Groups[1].Value
            }

            return ''
          }

          function Get-DiscordInstallerVersion([string]$Url, [string]$Path) {
            $version = ''
            $finalUrl = ''

            try {
              $head = Invoke-WebRequest -Uri $Url -MaximumRedirection 10 -Method Head
              $finalUrl = $head.BaseResponse.ResponseUri.AbsoluteUri
              $version = Extract-Version $finalUrl
            } catch {
              Write-Host "[WARN] Discord final URL alınamadı: $($_.Exception.Message)"
            }

            if (-not [string]::IsNullOrWhiteSpace($version)) {
              return $version
            }

            Write-Host "Discord version URL fallback used. finalUrl=$finalUrl"
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $Path))
            $version = Extract-Version $info.ProductVersion
            if (-not [string]::IsNullOrWhiteSpace($version)) {
              return $version
            }

            $version = Extract-Version $info.FileVersion
            if (-not [string]::IsNullOrWhiteSpace($version)) {
              return $version
            }

            throw "Discord installer sürümü çözümlenemedi: $Path"
          }

          Invoke-WebRequest -Uri $stableUrl -OutFile 'temp/DiscordSetup.exe'
          Invoke-WebRequest -Uri $ptbUrl -OutFile 'temp/DiscordPTBSetup.exe'

          $stableVersion = Get-DiscordInstallerVersion $stableUrl 'temp/DiscordSetup.exe'
          $ptbVersion = Get-DiscordInstallerVersion $ptbUrl 'temp/DiscordPTBSetup.exe'
          Write-Host "Discord stable version: $stableVersion"
          Write-Host "Discord PTB version: $ptbVersion"

          $wgcfRelease = Invoke-RestMethod -Uri 'https://api.github.com/repos/ViRb3/wgcf/releases/latest' -Headers @{ 'User-Agent' = 'SplitWire-Turkey-Release-Guard' }
          $wgcfAsset = $wgcfRelease.assets | Where-Object { $_.name -match 'windows_amd64' } | Select-Object -First 1
          if (-not $wgcfAsset) {
            throw 'wgcf windows_amd64 asset bulunamadı.'
          }

          Invoke-WebRequest -Uri $wgcfAsset.browser_download_url -OutFile 'temp/wgcf.exe'
          $wgcfVersion = [regex]::Match($wgcfAsset.name, '(\d+\.\d+\.\d+)').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($wgcfVersion)) {
            $wgcfVersion = $wgcfRelease.tag_name.TrimStart('v','V')
          }

          "stable_version=$stableVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ptb_version=$ptbVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "wgcf_version=$wgcfVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Enforce manifest update for release artifacts
        shell: pwsh
        run: |
          ./scripts/validate-manifest.ps1 `
            -WgcfVersion '${{ steps.collect.outputs.wgcf_version }}' `
            -WgcfPath 'temp/wgcf.exe' `
            -DiscordStableVersion '${{ steps.collect.outputs.stable_version }}' `
            -DiscordStablePath 'temp/DiscordSetup.exe' `
            -DiscordPtbVersion '${{ steps.collect.outputs.ptb_version }}' `
            -DiscordPtbPath 'temp/DiscordPTBSetup.exe'
