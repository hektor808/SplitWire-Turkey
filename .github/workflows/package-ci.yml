name: Package CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-package-manifest:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare prerequisites
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnetPrereqDir = 'Prerequisites/.NET 8.0'
          New-Item -ItemType Directory -Force -Path $dotnetPrereqDir | Out-Null

          $x64Path = "$dotnetPrereqDir/windowsdesktop-runtime-8.0.22-win-x64.exe"
          $x86Path = "$dotnetPrereqDir/windowsdesktop-runtime-8.0.22-win-x86.exe"

          if (!(Test-Path $x64Path)) {
            Invoke-WebRequest `
              -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.22/windowsdesktop-runtime-8.0.22-win-x64.exe" `
              -OutFile $x64Path
          }

          if (!(Test-Path $x86Path)) {
            Invoke-WebRequest `
              -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.22/windowsdesktop-runtime-8.0.22-win-x86.exe" `
              -OutFile $x86Path
          }

      - name: Build and prepare package input
        shell: cmd
        working-directory: src
        run: build_simple.bat

      - name: Debug package input
        shell: pwsh
        run: |
          Get-ChildItem -Recurse artifacts/package-input | Select-Object FullName
          if (!(Test-Path "artifacts/package-input/res/splitwire.ico")) {
            throw "Missing artifacts/package-input/res/splitwire.ico"
          }

      - name: Compile installer
        shell: cmd
        working-directory: src
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DPackageInputDir="..\artifacts\package-input" /DBuildArtifactsDir="..\artifacts\installer" /O"..\artifacts\installer" SplitWire-Turkey-Setup.iss'

      - name: Validate download manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path temp -Force | Out-Null

          $stableUrl = 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'
          $ptbUrl = 'https://discord.com/api/download/ptb?platform=win'

          Invoke-WebRequest -Uri $stableUrl -OutFile 'temp/DiscordSetup.exe'
          Invoke-WebRequest -Uri $ptbUrl -OutFile 'temp/DiscordPTBSetup.exe'

          $stableFinal = (Invoke-WebRequest -Uri $stableUrl -MaximumRedirection 10 -Method Head).BaseResponse.ResponseUri.AbsoluteUri
          $ptbFinal = (Invoke-WebRequest -Uri $ptbUrl -MaximumRedirection 10 -Method Head).BaseResponse.ResponseUri.AbsoluteUri

          $stableVersion = [regex]::Match($stableFinal, '(\d+\.\d+\.\d+)').Groups[1].Value
          $ptbVersion = [regex]::Match($ptbFinal, '(\d+\.\d+\.\d+)').Groups[1].Value

          if ([string]::IsNullOrWhiteSpace($stableVersion) -or [string]::IsNullOrWhiteSpace($ptbVersion)) {
            throw 'Discord installer sürümleri URL üzerinden çözümlenemedi.'
          }

          $wgcfRelease = Invoke-RestMethod -Uri 'https://api.github.com/repos/ViRb3/wgcf/releases/latest' -Headers @{ 'User-Agent' = 'SplitWire-Turkey-Package-CI' }
          $wgcfAsset = $wgcfRelease.assets | Where-Object { $_.name -match 'windows_amd64' } | Select-Object -First 1
          if (-not $wgcfAsset) {
            throw 'wgcf windows_amd64 asset bulunamadı.'
          }

          Invoke-WebRequest -Uri $wgcfAsset.browser_download_url -OutFile 'temp/wgcf.exe'
          $wgcfVersion = [regex]::Match($wgcfAsset.name, '(\d+\.\d+\.\d+)').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($wgcfVersion)) {
            $wgcfVersion = $wgcfRelease.tag_name.TrimStart('v','V')
          }

          ./scripts/validate-manifest.ps1 `
            -WgcfVersion $wgcfVersion `
            -WgcfPath 'temp/wgcf.exe' `
            -DiscordStableVersion $stableVersion `
            -DiscordStablePath 'temp/DiscordSetup.exe' `
            -DiscordPtbVersion $ptbVersion `
            -DiscordPtbPath 'temp/DiscordPTBSetup.exe'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splitwire-turkey-artifacts
          path: artifacts
          if-no-files-found: error
